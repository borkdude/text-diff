name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clojure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest
          bb: latest
      - run: bb test:clj

  babashka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@master
        with:
          bb: latest
      - run: bb test:bb
